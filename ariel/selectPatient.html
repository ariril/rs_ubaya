<!DOCTYPE HTML>
<html lang="en">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>MY RS UBAYA - Pilih Pasien</title>
<link rel="stylesheet" type="text/css" href="../../styles/bootstrap.css">
<link rel="stylesheet" type="text/css" href="../../styles/style.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="../../fonts/css/fontawesome-all.min.css">
<link rel="manifest" href="../../_manifest.json" data-pwa-version="set_in_manifest_and_pwa_js">
<link rel="apple-touch-icon" sizes="180x180" href="../../app/icons/icon-192x192.png">
</head>

<body class="theme-light">


<div id="preloader"><div class="spinner-border color-highlight" role="status"></div></div>

<div id="page">
    <div class="header header-fixed header-logo-left">
        <img src="../../images/logo_myrsubaya.png" alt="MY RS UBAYA" style="width: fit-content; height: 46px; margin-left: 12px;">
    </div>

    <div class="page-content header-clear-medium">
        <div class="content">
            <h1 class="mb-1">Pilih Pasien</h1>
            <p class="color-highlight mb-0">Nomor WhatsApp yang terdaftar ini terhubung ke beberapa pasien</p>
        </div>

        <div class="content" id="patient-list"></div>

    </div>
</div>

<script type="text/javascript" src="../../scripts/bootstrap.min.js"></script>
<script type="text/javascript" src="../../scripts/custom.js"></script>
<script type="text/javascript">
(function () {
    var patients = [
        { name: "Kristian Tanuwijaya", mrn: "00012345", age: "21 Tahun", gender: "Laki-laki", avatar: "../../images/avatars/KT-5.png" },
        { name: "Sebastian Hugo", mrn: "00067890", age: "18 Tahun", gender: "Laki-laki", avatar: "../../images/avatars/SH-6.png" }
    ];

    if (patients.length === 0) {
        window.location.href = "no-patient.html";
        return;
    }

    if (patients.length === 1) {
        window.location.href = "ariel/index.html";
        return;
    }

    var list = document.getElementById("patient-list");
    patients.forEach(function (patient) {
        var card = document.createElement("a");
        card.href = "index.html";
        card.className = "card card-style shadow-sm mb-3";
        card.innerHTML = ""
            + "<div class=\"content d-flex align-items-center\">"
            + "  <div class=\"rounded-m d-flex align-items-center justify-content-center me-3\" style=\"width:72px;height:72px;\">"
            + "      <img src=\"" + patient.avatar + "\" alt=\"" + patient.name + "\" width=\"56\" height=\"56\" class=\"rounded-xl\">"
            + "  </div>"
            + "  <div class=\"flex-grow-1\">"
            + "      <h4 class=\"mb-1\">" + patient.name + "</h4>"
            + "      <p class=\"font-12 mb-1 color-highlight\">" + patient.age + " \u2022 " + patient.gender + "</p>"
            + "      <p class=\"font-11 mb-0 color-theme opacity-60\">MRN: " + patient.mrn + "</p>"
            + "  </div>"
            + "</div>";
        list.appendChild(card);
    });
})();
</script>
</body>
</html>
