<body class="theme-light">


<div id="preloader"><div class="spinner-border color-highlight" role="status"></div></div>

<div id="page">
    <div class="header header-fixed header-logo-left">
        <!-- <a href="appointments.html" class="header-icon header-icon-1"><i class="fas fa-arrow-left"></i></a> -->
        <img src="../../images/logo_myrsubaya.png" alt="MY RS UBAYA" style="width: fit-content; height: 46px; margin-left: 12px;">
    </div>

    <div class="page-content header-clear-medium">
        <div class="content">
            <h1 class="mb-1">Detail Appointment</h1>
            <p class="color-highlight mb-0">Informasi jadwal dan antrian Anda</p>
        </div>

        <div class="divider divider-margins"></div>

        <div class="content">
            <div class="card card-style shadow-sm mb-3">
                <div class="content">
                    <h4 class="mb-1">dr. Mantap Ubaya, Sp.A</h4>
                    <p class="font-12 mb-2 color-highlight">Poli Anak</p>
                    <div class="d-flex justify-content-between">
                        <span class="font-12 color-theme opacity-60">Tanggal & Jam</span>

                    </div>
                    <div class="divider mt-2 mb-2"></div>
                    <div class="d-flex justify-content-between">
                        <span class="font-12 color-theme opacity-60">Nomor Antrian</span>
                        <span class="font-12 font-600">A-24</span>
                    </div>
                    <div class="divider mt-2 mb-2"></div>
                    <div class="d-flex justify-content-between">
                        <span class="font-12 color-theme opacity-60">Jam Estimasi Dilayani</span>
                        <span class="font-12 font-600">10:40 WIB</span>
                    </div>
                    <div class="divider mt-2 mb-2"></div>
                    <div class="d-flex justify-content-between">
                        <span class="font-12 color-theme opacity-60">Lobby Masuk</span>
                        <span class="font-12 font-600">Lobby B - Poli Anak</span>
                    </div>
                </div>
            </div>

            <div class="card card-style shadow-sm">
                <div class="content">
                    <h4 class="mb-1">Catatan</h4>
                    <p class="font-12 mb-0">Mohon hadir 15 menit sebelum jadwal.</p>
                </div>
            </div>
        </div>
